
name: Dota Rating Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  formal-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java
        run: java -version

      - name: Compile Java model
        run: javac src/RatingCalculator.java

      - name: Download KeY CI Tool
        run: |
          mkdir -p tools
          curl -fL \
            "https://formal.iti.kit.edu/weigl/ci-tool/latest.php?type=all" \
            -o tools/ci-tool.jar

      - name: Check downloaded JAR
        run: |
          ls -lh tools/ci-tool.jar
          jar tf tools/ci-tool.jar | grep 'CheckerKt.class' || true

      - name: Run formal verification
        run: java -jar tools/ci-tool.jar src/
