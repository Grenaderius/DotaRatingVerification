
name: Dota Rating Formal Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  formal-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check Java
        run: java -version

      - name: Compile Java model
        run: javac src/RatingCalculator.java

      - name: Download KeY CI Tool 1.7.0
        run: |
          mkdir -p tools

          curl -fL \
            "https://github.com/wadoon/key-citool/releases/download/v1.7.0/key-citool-1.7.0-all.jar" \
            -o tools/ci-tool.jar

      - name: Inspect KeY CI Tool
        run: |
          echo "=== JAR MANIFEST ==="
          unzip -p tools/ci-tool.jar META-INF/MANIFEST.MF

          echo "=== CHECKER CLASSES ==="
          jar tf tools/ci-tool.jar | grep -i 'Checker' || true

          echo "=== MAIN CLASS ==="
          jar tf tools/ci-tool.jar | grep 'de/uka/ilkd/key/' | head -30

          echo "=== FILE TYPE ==="
          file tools/ci-tool.jar

      - name: Run formal verification
        run: |
          java -jar tools/ci-tool.jar src/
